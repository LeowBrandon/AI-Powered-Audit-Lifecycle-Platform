services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      # Optional: enable external OpenAI-compatible LLM augmentation
      # - LLM_API_KEY=${LLM_API_KEY}
      # - LLM_MODEL=gpt-4o-mini
    volumes:
      - auditiq_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: auditiq
      POSTGRES_PASSWORD: auditiq_dev_password
      POSTGRES_DB: auditiq
    ports:
      - "5432:5432"
    volumes:
      - ./backend/schema/postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pg_data:/var/lib/postgresql/data

volumes:
  auditiq_data:
  pg_data:
